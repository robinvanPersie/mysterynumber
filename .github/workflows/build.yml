name: Build desktop packages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktopApp:packageNativeMacApp --no-daemon
      - run: ./gradlew :desktopApp:packageDmg --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mystery-numbers-macos
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew.bat :desktopApp:packageMsi --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mystery-numbers-windows
          path: desktopApp/build/compose/binaries/main/msi/*.msi
